[package]
name = "pomfret"
version = "0.1.0"
edition = "2021"
description = "Pomfret: Proxy Of Models For Routing, Evaluation & Telemetry — OpenAI-compatible API, backend routing, and web console"
license = "MIT"
repository = "https://github.com/mikewei/pomfret"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "timeout", "trace"] }
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.5"
tower = { version = "0.4", features = ["util"] }
http-body = "1.0"
http-body-util = "0.1"
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4"] }
mime_guess = "2.0"
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
async-trait = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
